name: Build DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-dmg:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --use-cache

      - name: Build NeoWidget.app
        run: |
          xcodebuild -project NeoWidget.xcodeproj -list
          xcodebuild \
            -project NeoWidget.xcodeproj \
            -scheme NeoWidget \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package DMG
        run: |
          set -euo pipefail
          mkdir -p dist
          APP_PATH="build/Build/Products/Release/NeoWidget.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "NeoWidget.app not found at $APP_PATH"
            find build -name "*.app" -maxdepth 6 -print
            exit 1
          fi
          # Ad-hoc codesign: sign embedded .appex first, then the .app
          codesign --force --deep --sign - "$APP_PATH/Contents/PlugIns/NeoWidgetExtension.appex" && codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          hdiutil create -volname "NeoWidget" -srcfolder "$APP_PATH" -ov -format UDZO "dist/NeoWidget.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoWidget-dmg
          path: dist/NeoWidget.dmg
          if-no-files-found: error

      - name: Create Pull Request to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="build/dmg-${GITHUB_RUN_ID}"
          DMG_SRC="${GITHUB_WORKSPACE}/dist/NeoWidget.dmg"
          DMG_TMP="/tmp/NeoWidget-${GITHUB_RUN_ID}.dmg"
          cp "$DMG_SRC" "$DMG_TMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          mkdir -p dist
          cp "$DMG_TMP" dist/NeoWidget.dmg
          git add -f dist/NeoWidget.dmg
          if git diff --cached --quiet; then
            echo "No DMG changes to propose."
            exit 0
          fi
          git commit -m "chore: update NeoWidget.dmg build artifact [skip ci]"
          git push origin "$BRANCH"
          PR_URL=$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url')
          if [ -z "$PR_URL" ] || [ "$PR_URL" = "null" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore: update NeoWidget.dmg build artifact" \
              --body "Automated DMG build from workflow run ${GITHUB_RUN_ID}. Includes ad-hoc codesigned NeoWidget.app and embedded NeoWidgetExtension.appex."
          else
            echo "PR already exists: $PR_URL"
          fi
