<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoWidget Controller</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: rgba(20, 20, 20, 0.95);
      color: #0ff;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
    }
    .btn {
      background: transparent;
      border: 1px solid #0ff;
      color: #0ff;
      padding: 10px;
      margin: 5px 0;
      width: 100%;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 5px #0ff;
    }
    .btn:hover {
      background: #0ff;
      color: #000;
      box-shadow: 0 0 15px #0ff;
    }
    h2 { text-align: center; text-shadow: 0 0 10px #0ff; }
  </style>
</head>
<body>
  <h2>NeoWidget Controller</h2>
  <button class="btn" id="addSlotBtn">Add Empty Widget Slot</button>
  <div id="slotsList"></div>

  <script>
    const addSlotBtn = document.getElementById('addSlotBtn');
    addSlotBtn.addEventListener('click', () => {
      window.api.send('add-slot');
    });

    window.api.receive('slot-created', (slotId) => {
      const div = document.createElement('div');
      div.style.margin = '10px 0';
      div.innerHTML = `Slot ${slotId} <button class="btn" style="width:auto;padding:2px 5px" onclick="window.api.send('open-editor', '${slotId}')">Edit</button>`;
      document.getElementById('slotsList').appendChild(div);
    });
  </script>
</body>
</html>
