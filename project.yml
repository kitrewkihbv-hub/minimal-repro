name: NeoWidget

options:
  bundleIdPrefix: com.neowidget
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  NeoWidget:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/NeoWidget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neowidget.app
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    dependencies:
      - target: NeoWidgetExtension
        embed: true

  NeoWidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/NeoWidgetExtension
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neowidget.app.extension
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SKIP_INSTALL: YES
    info:
      # XcodeGen's Plist spec requires an explicit `path:` — a bare
      # `properties:`-only map fails with: Decoding failed at "path"
      # XcodeGen generates the Info.plist at this path on `generate`.
      path: Sources/NeoWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: NeoWidgetExtension
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  NeoWidget:
    build:
      targets:
        NeoWidget: all
        NeoWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
