name: NeoWidget

options:
  bundleIdPrefix: com.neowidget
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  NeoWidget:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/NeoWidget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neowidget.app
        PRODUCT_NAME: NeoWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/NeoWidget/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Sources/NeoWidget/Info.plist
      properties:
        CFBundleName: NeoWidget
        CFBundleDisplayName: NeoWidget
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 NeoWidget"
        CFBundleURLTypes:
          - CFBundleURLName: com.neowidget.app
            CFBundleURLSchemes:
              - neowidget
    dependencies:
      - target: NeoWidgetExtension
        embed: true
        codeSign: true

  NeoWidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/NeoWidgetExtension
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neowidget.app.extension
        PRODUCT_NAME: NeoWidgetExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/NeoWidgetExtension/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    info:
      path: Sources/NeoWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: NeoWidgetExtension
        CFBundleName: NeoWidgetExtension
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: XPC!
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  NeoWidget:
    build:
      targets:
        NeoWidget: all
        NeoWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
