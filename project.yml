name: NeoWidget
options:
  bundleIdPrefix: com.neowidget
  deploymentTarget:
    macOS: "14.0"
  codeSigning:
    codeSignIdentity: "-"
    codeSigningAllowed: NO
    codeSigningRequired: NO
targets:
  - name: NeoWidget
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    bundleId: com.neowidget.app
    sources: [Sources/NeoWidget]
    resources: [Sources/NeoWidget/Resources]
    dependencies:
      - target: NeoWidgetExtension
    settings:
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      DEVELOPMENT_TEAM: ""
      BASE_SDK: macosx14.0
      SWIFT_VERSION: "5.9"
      ARCHS: arm64
  - name: NeoWidgetExtension
    type: appExtension
    platform: macOS
    deploymentTarget: "14.0"
    bundleId: com.neowidget.app.extension
    extensionPointIdentifier: com.apple.widgetkit-extension
    sources: [Sources/NeoWidgetExtension]
    resources: [Sources/NeoWidgetExtension/Resources]
    settings:
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      DEVELOPMENT_TEAM: ""
      BASE_SDK: macosx14.0
      SWIFT_VERSION: "5.9"
      ARCHS: arm64
